[package]
name = "ftpie"
version = "0.1.0"
edition = "2021"
description = "A modern, git-aware FTP client with AI integration"
authors = ["ftpie contributors"]
license = "Apache-2.0"

[lib]
name = "ftpie_lib"
crate-type = ["rlib"]

[[bin]]
name = "ftpie"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# FTP/FTPS (sync API, run via spawn_blocking)
suppaftp = { version = "6", features = ["secure"] }

# Git
git2 = { version = "0.19", features = ["vendored-openssl"] }

# HTTP client (AI API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encryption (bookmark sync, credential store)
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"

# Scripting engine (automation DSL)
rhai = { version = "1", features = ["sync"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# UUID (session IDs, transfer IDs)
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing (diff, file change detection)
sha2 = "0.10"
hex = "0.4"

# Dirs (config path)
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
