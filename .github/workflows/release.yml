name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-cargo-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ matrix.name }}-

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # =================================================================
          # UPDATER SIGNING  (currently DISABLED — no updater endpoint is
          # configured in tauri.conf.json, so nothing is signed today.)
          #
          # To enable:
          #   1. `npx tauri signer generate -w ~/.tauri/ftpie.key`
          #   2. Store the PRIVATE key as the TAURI_SIGNING_PRIVATE_KEY secret
          #      and its passphrase as TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
          #   3. Put the PUBLIC key in tauri.conf.json under
          #      plugins.updater.pubkey, add plugins.updater.endpoints, and add
          #      the tauri-plugin-updater dependency + `updater:default`
          #      permission to capabilities/default.json.
          #   4. Uncomment the two lines below.
          # =================================================================
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # =================================================================
          # WINDOWS CODE SIGNING (Authenticode)
          #
          # Requires the MSVC target (MinGW builds cannot be signed this way).
          #   WINDOWS_CERTIFICATE          base64 of a .pfx / .p12 bundle
          #   WINDOWS_CERTIFICATE_PASSWORD its export password
          #
          # tauri-action picks these up and configures signtool. Uncomment the
          # two lines below once the secrets exist in the repository settings.
          # =================================================================
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

          # =================================================================
          # macOS SIGNING + NOTARIZATION
          #
          #   APPLE_CERTIFICATE           base64 of the "Developer ID
          #                               Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD  its export password
          #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Acme (TEAMID)"
          #   APPLE_ID                    Apple account email
          #   APPLE_PASSWORD              app-specific password for notarytool
          #   APPLE_TEAM_ID               10-character team id
          #
          # All of APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID must be present
          # together or notarization is skipped. Uncomment once configured.
          # =================================================================
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'ftpie ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
