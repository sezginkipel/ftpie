[target.x86_64-pc-windows-gnu]
# Sistem MSYS2 GCC + LLD
linker = "C:\\msys64\\mingw64\\bin\\gcc.exe"
rustflags = [
    "-Clink-arg=-fuse-ld=lld",
    # PE header'da main thread stack'ini 64 MB olarak ayarla
    # (Rhai init + debug build büyük frame'leri için)
    "-Clink-arg=-Wl,--stack",
    "-Clink-arg=67108864",
]

[env]
CC  = "C:\\msys64\\mingw64\\bin\\gcc.exe"
CXX = "C:\\msys64\\mingw64\\bin\\g++.exe"
AR  = "C:\\msys64\\mingw64\\bin\\ar.exe"
CARGO_TARGET_DIR = "F:\\ftpie-target"
